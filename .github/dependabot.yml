version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/spiga-simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      compatible-maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
